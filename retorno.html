<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Resultado do Pagamento | Navoryx</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .payment-return {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .payment-return-card {
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 40px 28px;
      border: 1px solid #243242;
      border-radius: 18px;
      background: #0c1118;
    }

    .payment-return-icon {
      font-size: 56px;
      margin-bottom: 20px;
    }

    .payment-return-card h1 {
      margin-bottom: 14px;
    }

    .payment-return-card p {
      margin-bottom: 28px;
      color: #aebccc;
      line-height: 1.6;
    }

    .payment-return-button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      background: #1687d9;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <main class="payment-return">

    <section class="payment-return-card">

      <div id="statusIcon" class="payment-return-icon">
        ⏳
      </div>

      <h1 id="statusTitle">
        Verificando pagamento...
      </h1>

      <p id="statusMessage">
        Aguarde enquanto verificamos o resultado do seu pagamento.
      </p>

      <a href="index.html" class="payment-return-button">
        Voltar para a loja
      </a>

    </section>

  </main>

  <script>
    const parametros = new URLSearchParams(window.location.search);
    const pedidoId = parametros.get('pedido');
    const statusIcon = document.getElementById('statusIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusMessage = document.getElementById('statusMessage');

    function exibirStatus(status) {
      if (status === 'approved') {
        statusIcon.textContent = '✅';
        statusTitle.textContent = 'Pagamento aprovado!';
        statusMessage.textContent =
          'Seu pagamento foi confirmado com segurança. Obrigado por comprar na Navoryx.';
        localStorage.removeItem('navoryxCart');
        return;
      }

      if (status === 'pending' || status === 'in_process' || status === 'creating') {
        statusIcon.textContent = '⏳';
        statusTitle.textContent = 'Pagamento em processamento';
        statusMessage.textContent =
          'Estamos aguardando a confirmação do Mercado Pago. Você pode voltar mais tarde; o pedido continuará registrado.';
        return;
      }

      if (status === 'approved_stock_review') {
        statusIcon.textContent = '⚠️';
        statusTitle.textContent = 'Pagamento confirmado';
        statusMessage.textContent =
          'Recebemos o pagamento e o pedido está em conferência de estoque. Entre em contato com o atendimento.';
        localStorage.removeItem('navoryxCart');
        return;
      }

      statusIcon.textContent = '❌';
      statusTitle.textContent = 'Pagamento não aprovado';
      statusMessage.textContent =
        'O pagamento não foi concluído. Você pode voltar para a loja e tentar novamente.';
    }

    async function consultarPedido(tentativa = 0) {
      if (!pedidoId) {
        exibirStatus('unknown');
        return;
      }

      try {
        const resposta = await fetch(
          'https://navoryx-backend-2.onrender.com/pedidos/' +
          encodeURIComponent(pedidoId) +
          '/status'
        );
        if (!resposta.ok) throw new Error('Pedido não encontrado.');
        const pedido = await resposta.json();

        if (
          tentativa < 3 &&
          (pedido.status === 'pending' || pedido.status === 'creating')
        ) {
          setTimeout(() => consultarPedido(tentativa + 1), 2000);
          return;
        }

        exibirStatus(pedido.status);
      } catch (_) {
        statusIcon.textContent = '⏳';
        statusTitle.textContent = 'Verificação em andamento';
        statusMessage.textContent =
          'Não conseguimos consultar o pedido agora. Ele permanece registrado e poderá ser acompanhado pelo atendimento.';
      }
    }

    consultarPedido();
  </script>

</body>

</html>
