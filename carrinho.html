<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carrinho | Navoryx</title>

  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="topbar">
    Compra segura • Ofertas selecionadas • Atendimento
  </div>

  <header class="header">

    <div class="container header-inner">

      <a href="index.html" class="brand">
        <img
          src="img/logo.png"
          alt="Navoryx"
          class="logo-navoryx">
      </a>

      <form class="search" action="index.html" method="get">

        <input
          type="search"
          name="busca"
          placeholder="O que você procura?"
          autocomplete="off">

        <button type="submit">
          Buscar
        </button>

      </form>

      <a href="carrinho.html" class="cart-button">
        🛒
        <span id="cartCount">0</span>
      </a>

    </div>

    <nav class="nav">
      <a href="index.html">Início</a>
      <a href="index.html#categorias">Categorias</a>
      <a href="index.html#destaques">Destaques</a>
      <a href="index.html#beneficios">Vantagens</a>
      <a href="index.html#contato">Contato</a>
    </nav>

  </header>


  <main>

    <section class="cart-page">

      <div class="container">

        <h1>Seu carrinho</h1>

        <div class="cart-layout">

          <!-- PRODUTOS DO CARRINHO -->
          <div
            class="cart-items"
            id="cartItems">
          </div>


          <!-- RESUMO DO PEDIDO -->
          <aside class="cart-summary">

            <h2>
              Resumo do pedido
            </h2>


            <div class="summary-line">

              <span>
                Produtos
              </span>

              <span id="summaryProducts">
                R$ 0,00
              </span>

            </div>


            <div class="summary-line">

              <span>
                Frete
              </span>

              <span>
                Calculado no checkout
              </span>

            </div>


            <div class="summary-total">

              <span>
                Total
              </span>

              <strong id="cartTotal">
                R$ 0,00
              </strong>

            </div>


            <button
              type="button"
              class="checkout-button"
              id="checkoutButton">

              Finalizar compra

            </button>


            <a
              href="index.html#destaques"
              class="continue-shopping">

              ← Continuar comprando

            </a>

          </aside>

        </div>

      </div>

    </section>

  </main>


  <footer>

    <div class="container footer-inner">

      <div>

        <strong class="footer-logo">
          NAVORYX
        </strong>

        <p>
          Tecnologia • Acessórios • Utilidades
        </p>

      </div>


      <div>

        <p>
          © 2026 Navoryx.
        </p>

      </div>

    </div>

  </footer>


  <script src="script.js"></script>

</body>

</html>
